# Railway: deploy from monorepo root with Docker
# Dashboard → New Project → Deploy from GitHub → this repo
# Settings → Root Directory: / (repo root)
# Settings → Builder: Dockerfile

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
